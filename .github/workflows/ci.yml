name: Package and configuration checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.8.8"
          python-version: "3.12"
          enable-cache: false
      - name: Validate Dependabot configuration
        run: uvx --python 3.12 --from check-jsonschema==0.38.2 check-jsonschema --builtin-schema vendor.dependabot .github/dependabot.yml
      - name: Build distributions without importing platform handlers
        run: uv build --python 3.12
      - name: Validate distribution metadata
        run: uvx --python 3.12 --from twine==7.0.0 twine check dist/*
